<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小暖 · 交互概念演示</title>
<style>
:root{font-family:'Source Han Sans CN','Microsoft YaHei',sans-serif;color:#14181a;background:#eeeae4}*{box-sizing:border-box}body{margin:0}header{padding:20px 32px;background:#fff;border-bottom:1px solid #e3dfd7;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0;color:#0e6e63}header span{color:#61696d;font-size:16px}main{max-width:1160px;margin:24px auto;padding:0 24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}button,input{font:inherit}nav button,.controls button{border:1px solid #b9c5c1;border-radius:8px;padding:10px 16px;background:#fff;color:#14181a;cursor:pointer}nav button[aria-current=true]{background:#0e6e63;color:#fff}.device{width:100%;aspect-ratio:1024/600;position:relative;overflow:hidden;background:#f6f3ee;touch-action:manipulation;user-select:none}.device svg{width:100%;height:100%;display:block}.hit{position:absolute;background:transparent;border:0;color:transparent;padding:0;cursor:pointer}.hit:focus-visible{outline:3px solid #c9761f;outline-offset:-4px}.hit:disabled{cursor:not-allowed;background:#f6f3ee77}.controls{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls input{max-width:280px;padding:10px;border:1px solid #b9c5c1;border-radius:8px}#message{background:#fff;padding:14px 18px;line-height:1.6;min-height:58px;border-left:4px solid #0e6e63;margin-top:16px}.hint{font-size:15px;color:#61696d;line-height:1.7}dialog{border:1px solid #e3dfd7;border-radius:20px;padding:28px;max-width:520px;width:90%;box-shadow:0 20px 60px #0002}dialog::backdrop{background:#14181a66}dialog h2{font-size:26px;margin-top:0}dialog p{font-size:20px;line-height:1.7}dialog button{font:inherit;padding:14px 22px;border-radius:10px;margin:6px;border:1px solid #0e6e63;background:#fff;color:#0e6e63;cursor:pointer}dialog .primary{background:#0e6e63;color:white}#hold{position:absolute;bottom:2%;left:40%;padding:6px 14px;border-radius:16px;background:#14181a;color:white;font-size:18px;pointer-events:none} @media(max-width:650px){header{padding:15px}main{padding:0 10px}nav button{padding:8px;font-size:14px}}
</style>
<header><h1>小暖 · 交互概念演示</h1><span>界面反馈与数据为模拟 · 院内手持式终端</span></header>
<main><nav aria-label="查看七个设计页面" id="nav"></nav><div class="device" id="device" aria-label="1024乘600设备屏"></div>
<div class="controls"><button id="restart">重新开始</button><button id="return">归还设备</button><label for="voice">模拟说话</label><input id="voice" placeholder="例如：对、再说一遍、等等、到了"><button id="say">说出这句话</button><button id="sound" aria-pressed="false">打开演示语音</button></div>
<p id="message" role="status" aria-live="polite">请选择使用方式。入口屏按住任意位置2秒，也可进入语音通道。</p>
<p class="hint">操作提示：01长按2秒进入语音；进入02后长按1.5秒求助，说「再说一遍」重播。其他页面只长按右下求助键。上方页签供评审对照，不是设备内的功能。演示语音由浏览器可用声音播放，不接入医院、医疗建议或真实通知服务。</p></main>
<dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div id="dialogButtons"></div></dialog>
<script src="screens.js"></script><script src="app.js"></script></html>
