<svg xmlns="http&#58;//www.w3.org/2000/svg" width="1024" height="600" viewBox="0 0 1024 600" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <title>01 入口分流</title>
  <desc>小暖院内陪诊终端, 入口分流屏</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14181A" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1024" height="600" fill="#F6F3EE"/>

  <circle cx="52" cy="56" r="4" fill="#61696D"/>
  <text x="66" y="62" font-size="18" fill="#61696D">已开机 / 门诊大厅</text>
  <text x="976" y="62" font-size="18" fill="#61696D" text-anchor="end">20:51 / 已联网</text>
  <line x1="48" y1="84" x2="976" y2="84" stroke="#E3DFD7" stroke-width="1"/>

  <text x="48" y="150" font-size="56" font-weight="700" fill="#14181A">您好, 我是小暖</text>
  <text x="48" y="200" font-size="26" fill="#61696D">今天是谁来看病? 点一下就行, 选错了随时能重选.</text>

  <rect x="48" y="224" width="288" height="232" rx="22" fill="#FFFFFF" stroke="#E3DFD7" filter="url(#shadow)"/>
  <rect x="72" y="248" width="64" height="64" rx="16" fill="#F6F3EE" stroke="#E3DFD7"/>
  <g transform="translate(88 264) scale(1.3333)" fill="none" stroke="#0E6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="7.5" r="3.5"/>
    <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>
  </g>
  <text x="72" y="368" font-size="40" font-weight="700" fill="#14181A">老人自己来</text>
  <text x="72" y="412" font-size="22" fill="#61696D">字大, 慢慢说,</text>
  <text x="72" y="442" font-size="22" fill="#61696D">忘了有我提醒</text>

  <rect x="368" y="224" width="288" height="232" rx="22" fill="#FFFFFF" stroke="#E3DFD7" filter="url(#shadow)"/>
  <rect x="392" y="248" width="64" height="64" rx="16" fill="#F6F3EE" stroke="#E3DFD7"/>
  <g transform="translate(408 264) scale(1.3333)" fill="none" stroke="#0E6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12c2-4 5.5-6 9-6s7 2 9 6c-2 4-5.5 6-9 6s-7-2-9-6z"/>
    <circle cx="12" cy="12" r="2.5"/>
    <path d="M4 4l16 16"/>
  </g>
  <text x="392" y="368" font-size="40" font-weight="700" fill="#14181A">眼睛看不见</text>
  <text x="392" y="412" font-size="22" fill="#61696D">全程语音,</text>
  <text x="392" y="442" font-size="22" fill="#61696D">不用碰屏幕</text>

  <rect x="688" y="224" width="288" height="232" rx="22" fill="#FFFFFF" stroke="#E3DFD7" filter="url(#shadow)"/>
  <rect x="712" y="248" width="64" height="64" rx="16" fill="#F6F3EE" stroke="#E3DFD7"/>
  <g transform="translate(728 264) scale(1.3333)" fill="none" stroke="#0E6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 9c0-2.8 1.8-5 4-5s4 2.2 4 5c0 2.5-2 3.5-2 6 0 1.5-1 2.5-2.5 2.5S9 16.5 9 15"/>
    <path d="M4 4l16 16"/>
  </g>
  <text x="712" y="368" font-size="40" font-weight="700" fill="#14181A">耳朵听不见</text>
  <text x="712" y="412" font-size="22" fill="#61696D">看字就行,</text>
  <text x="712" y="442" font-size="22" fill="#61696D">也能替您开口</text>

  <text x="48" y="552" font-size="22" fill="#61696D">看不见? 按住屏幕任意位置两秒, 我来说给您听.</text>

  <circle cx="932" cy="514" r="44" fill="#B5392F"/>
  <text x="932" y="521" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">求助</text>
</svg>
